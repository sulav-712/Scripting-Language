<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grade Checker</title>
</head>
<body>
  <h1>Grade Checker</h1>
  <pre id="output"></pre>

  <script>
    const A = 2;
    const B = 8;
    const C = 1;
    const D = 2;

    const total = A + B + C + D + 50;
    const average = total / 4;

    const status = (total >= 60) ? "Pass" : "Fail";

    let grade;
    if(total >= 80) {
      grade = "Distinction";
    } else if (total >= 60) {
      grade = "First Division";
    } else if (total >= 40) {
      grade = "Second Dvision";
    } else {
      grade = "Fail";
    }

    let output = "";
    output += `Total: ${total}\n`;
    output += `Average: ${average}\n`;
    output += `Status: ${status}\n`;
    output += `Grade: ${grade}\n`;
    output += `Subjects:\n`;

    for (let i = 1; i <= B; i++) {
      output += `Subject ${i}\n`;
    }

    let remark;
    switch (D) {
      case 0:
        remark = "Excellent";
        break;
      case 1:
        remark = "Very Good";
        break;
      case 2:
        remark = "Good";
        break;
      case 3:
        remark = "Average";
        break;
      default:
        remark = "Keep trying";
        break;
    }

    output += `Remark: ${remark}\n`;

    document.getElementById("output").textContent = output;
  </script>
</body>
</html>
