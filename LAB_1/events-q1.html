/* A page with a button that counts clicks, and a form whose default submission is stopped. */ 

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Click Counter & Form Guard</title>
</head>
<body>
  <div id="outer">
    <button id="btn">Click Me</button>
    <p id="count">Clicks: 0</p>
    <form id="myForm">
      <input type="text" />
      <button type="submit">Submit</button>
    </form>
  </div>
  <script>
    const A = 2;
    const B = 8;
    const C = 1;
    const D = 2;
    let clicks = 0;
    const btn = document.getElementById('btn');
    const count = document.getElementById('count');
    const outer = document.getElementById('outer');
    const form = document.getElementById('myForm');

    btn.addEventListener("click", function(e) {
      clicks++;
      count.textContent = "Clicks: " + clicks;
      console.log(e.type);
      console.log(e.target.tagName);
      if (clicks === B) {
        console.log("Reached " + B + " clicks, Student" + A);
      }
    });
    form.addEventListener("submit", function(e) {
      e.preventDefault();
      console.log("Form submit blocked by Student" + C + D);
    });
    outer.addEventListener("click", function() {
      console.log("Bubbled to outer");
    })
  </script>
</body>
</html>
